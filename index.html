<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ravi Kumar Prajapati</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#050816;
    font-family:Arial, Helvetica, sans-serif;
    overflow:hidden;
}

/* Animated background */
body::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:linear-gradient(135deg,#225cff,#7a24c9,#ed0058);
    filter:blur(120px);
    opacity:.35;
    animation:move 8s infinite alternate ease-in-out;
}

@keyframes move{
    0%{
        transform:translate(-200px,-100px);
    }
    100%{
        transform:translate(200px,120px);
    }
}

/* Poster */
.poster{
    position:relative;
    width:min(900px,90%);
    padding:70px 50px;
    text-align:center;
    border:1px solid rgba(255,255,255,.15);
    border-radius:30px;
    background:rgba(8,12,35,.78);
    backdrop-filter:blur(20px);
    box-shadow:0 30px 100px rgba(0,0,0,.5);
    overflow:hidden;
}

/* Border glow */
.poster::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:30px;
    padding:2px;
    background:linear-gradient(
        90deg,
        transparent,
        #225cff,
        #ed0058,
        #ffd32a,
        transparent
    );
    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    animation:borderMove 5s linear infinite;
}

@keyframes borderMove{
    0%{transform:translateX(-30%);}
    100%{transform:translateX(30%);}
}

.small{
    position:relative;
    color:#ffd32a;
    font-size:15px;
    letter-spacing:5px;
    text-transform:uppercase;
    margin-bottom:20px;
}

h1{
    position:relative;
    font-size:clamp(45px,8vw,90px);
    line-height:1;
    font-weight:900;
    letter-spacing:-3px;

    background:linear-gradient(
        90deg,
        #ffffff,
        #65a0ff,
        #ffffff,
        #ff4d9d
    );

    background-size:300%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:textMove 5s infinite linear;
}

@keyframes textMove{
    0%{background-position:0%;}
    100%{background-position:300%;}
}

.role{
    position:relative;
    margin-top:25px;
    font-size:22px;
    color:#aeb8d8;
    letter-spacing:3px;
}

.line{
    position:relative;
    width:100px;
    height:3px;
    margin:30px auto;
    background:linear-gradient(90deg,#225cff,#ed0058);
    border-radius:10px;
}

.description{
    position:relative;
    max-width:650px;
    margin:auto;
    color:#d7dcf0;
    font-size:17px;
    line-height:1.7;
}

.skills{
    position:relative;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin-top:35px;
}

.skill{
    padding:10px 18px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:30px;
    color:#fff;
    background:rgba(255,255,255,.05);
    transition:.3s;
}

.skill:hover{
    transform:translateY(-5px);
    background:rgba(34,92,255,.25);
    border-color:#225cff;
}

.footer{
    position:relative;
    margin-top:40px;
    color:#7f8aaa;
    font-size:13px;
    letter-spacing:2px;
}

/* Floating particles */
.particle{
    position:absolute;
    width:5px;
    height:5px;
    background:#fff;
    border-radius:50%;
    opacity:.4;
    animation:float 6s infinite ease-in-out;
}

.p1{left:10%;top:20%;}
.p2{left:85%;top:25%;animation-delay:1s;}
.p3{left:20%;top:80%;animation-delay:2s;}
.p4{left:75%;top:75%;animation-delay:3s;}

@keyframes float{
    0%,100%{
        transform:translateY(0);
        opacity:.2;
    }
    50%{
        transform:translateY(-30px);
        opacity:.8;
    }
}
</style>
</head>

<body>

<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>

<div class="poster">

    <div class="small">Creative Portfolio</div>

    <h1>Ravi Kumar<br>Prajapati</h1>

    <div class="role">
        VIDEO EDITOR • GRAPHIC DESIGNER
    </div>

    <div class="line"></div>

    <div class="description">
        Turning creative ideas into powerful visuals,
        engaging motion graphics and memorable digital experiences.
    </div>

    <div class="skills">
        <div class="skill">Motion Graphics</div>
        <div class="skill">Video Editing</div>
        <div class="skill">Graphic Design</div>
        <div class="skill">Creative Visuals</div>
    </div>

    <div class="footer">
        CREATE • DESIGN • EDIT • IMPACT
    </div>

</div>

</body>
</html>
